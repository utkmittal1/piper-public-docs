<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" role="img" aria-labelledby="ttl desc">
  <title id="ttl">The core loop</title>
  <desc id="desc">Four stages in a cycle. You describe what you need. Piper plans the steps. Piper works step by step. You review and approve, and that steers the next round.</desc>
  <style>
    svg { --ink:#1a1712; --fill:#f4f0e6; --accent:#a03a22; }
    @media (prefers-color-scheme: dark) { svg { --ink:#e9eae4; --fill:#242b27; --accent:#b4552e; } }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill:var(--ink); }
    .box { fill:var(--fill); stroke:var(--ink); stroke-opacity:.45; stroke-width:1.5; }
    .acc-box { fill:var(--fill); stroke:var(--accent); stroke-width:2; }
    .t { font-size:15px; font-weight:600; }
    .s { font-size:13px; fill-opacity:.72; }
    .ln { fill:none; stroke:var(--ink); stroke-opacity:.55; stroke-width:1.5; marker-end:url(#ar); }
    .acc-ln { fill:none; stroke:var(--accent); stroke-width:1.75; marker-end:url(#arA); }
    .acc-t { font-size:13px; fill:var(--accent); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="var(--ink)" fill-opacity=".55"/>
    </marker>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="var(--accent)"/>
    </marker>
  </defs>

  <rect class="box" x="30" y="40" width="170" height="92" rx="10"/>
  <text class="t" x="115" y="76" text-anchor="middle">You describe</text>
  <text class="s" x="115" y="98" text-anchor="middle">what you need</text>

  <rect class="box" x="247" y="40" width="170" height="92" rx="10"/>
  <text class="t" x="332" y="76" text-anchor="middle">Piper plans</text>
  <text class="s" x="332" y="98" text-anchor="middle">the steps</text>

  <rect class="box" x="464" y="40" width="170" height="92" rx="10"/>
  <text class="t" x="549" y="76" text-anchor="middle">Piper works</text>
  <text class="s" x="549" y="98" text-anchor="middle">step by step</text>

  <rect class="acc-box" x="681" y="40" width="170" height="92" rx="10"/>
  <text class="t" x="766" y="76" text-anchor="middle">You review</text>
  <text class="s" x="766" y="98" text-anchor="middle">and approve</text>

  <path class="ln" d="M208 86 H239"/>
  <path class="ln" d="M425 86 H456"/>
  <path class="ln" d="M642 86 H673"/>

  <path class="acc-ln" d="M766 138 V180 Q766 190 756 190 H125 Q115 190 115 180 V144"/>
  <text class="acc-t" x="440" y="213" text-anchor="middle">and you steer the next round</text>
</svg>
