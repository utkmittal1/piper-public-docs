<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" role="img" aria-labelledby="ttl desc">
  <title id="ttl">The sandbox: writes confined, reads open</title>
  <desc id="desc">A task sits inside its write boundary, the session's own folder. Its writes stop at the boundary. Its reads cross the boundary and reach the rest of your Mac, including your documents and files other sessions made. Credential stores are closed to every task. macOS enforces the boundary below the level of any program.</desc>
  <style>
    svg { --ink:#1a1712; --fill:#f4f0e6; --accent:#a03a22; }
    @media (prefers-color-scheme: dark) { svg { --ink:#e9eae4; --fill:#242b27; --accent:#b4552e; } }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill:var(--ink); }
    .box { fill:var(--fill); stroke:var(--ink); stroke-opacity:.45; stroke-width:1.5; }
    .shell { fill:none; stroke:var(--ink); stroke-opacity:.45; stroke-width:1.5; }
    .acc-shell { fill:none; stroke:var(--accent); stroke-width:2; }
    .blocked { fill:none; stroke:var(--ink); stroke-opacity:.45; stroke-width:1.5; stroke-dasharray:6 5; }
    .t { font-size:16px; font-weight:600; }
    .c { font-size:14px; font-weight:600; }
    .s { font-size:13.5px; fill-opacity:.72; }
    .xs { font-size:12px; fill-opacity:.72; }
    .ln { fill:none; stroke:var(--ink); stroke-opacity:.55; stroke-width:1.5; marker-end:url(#ar); }
    .acc-ln { fill:none; stroke:var(--accent); stroke-width:1.75; marker-end:url(#stop); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="var(--ink)" fill-opacity=".55"/>
    </marker>
    <marker id="stop" viewBox="0 0 12 24" refX="6" refY="12" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="24" orient="auto">
      <path d="M6 1 V23" stroke="var(--accent)" stroke-width="3" fill="none"/>
    </marker>
  </defs>

  <rect class="acc-shell" x="30" y="60" width="310" height="230" rx="12"/>
  <text class="t" x="54" y="94">Write boundary</text>
  <text class="s" x="54" y="116">the session's own folder</text>

  <rect class="box" x="54" y="132" width="200" height="68" rx="10"/>
  <text class="c" x="154" y="172" text-anchor="middle">This task</text>

  <text class="xs" x="250" y="222" text-anchor="middle">writes</text>
  <path class="acc-ln" d="M154 200 V222 Q154 232 164 232 H340"/>
  <path d="M340 210 V254" stroke="var(--accent)" stroke-width="5" fill="none"/>

  <text class="s" x="54" y="270">It writes here and nowhere else.</text>

  <text class="s" x="440" y="104" text-anchor="middle">Reads are open</text>
  <path class="ln" d="M254 148 C 300 148 304 127 344 127 H532"/>
  <path class="ln" d="M254 184 C 300 184 304 187 344 187 H532"/>

  <rect class="shell" x="540" y="60" width="310" height="230" rx="12"/>
  <text class="t" x="564" y="94">The rest of your Mac</text>

  <rect class="box" x="564" y="104" width="262" height="46" rx="8"/>
  <text class="s" x="580" y="133">Your documents and downloads</text>

  <rect class="box" x="564" y="164" width="262" height="46" rx="8"/>
  <text class="s" x="580" y="193">Files other sessions made</text>

  <rect class="blocked" x="564" y="222" width="262" height="56" rx="8"/>
  <circle cx="588" cy="250" r="9" fill="none" stroke="var(--ink)" stroke-opacity=".55" stroke-width="1.75"/>
  <path d="M582 256 L594 244" stroke="var(--ink)" stroke-opacity=".55" stroke-width="1.75" fill="none"/>
  <text class="c" x="608" y="247">Credential stores</text>
  <text class="xs" x="608" y="266">closed to every task</text>

  <text class="s" x="30" y="330">macOS enforces the boundary below the level of any program.</text>
</svg>
