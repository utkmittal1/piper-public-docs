<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-labelledby="ttl desc">
  <title id="ttl">How Chief of Stuff works</title>
  <desc id="desc">The sources you switch on, such as Gmail, Slack, Google Calendar, Google Drive, Notion, and any other app you connect, feed Chief of Stuff. It checks them, does the work itself, and stacks finished cards under Ready, grouped as Before your next meeting and Ready for you. You send, open, or dismiss each card, and nothing goes out until you click.</desc>
  <style>
    svg { --ink:#1a1712; --fill:#f4f0e6; --accent:#a03a22; }
    @media (prefers-color-scheme: dark) { svg { --ink:#e9eae4; --fill:#242b27; --accent:#b4552e; } }
    text { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill:var(--ink); }
    .box { fill:var(--fill); stroke:var(--ink); stroke-opacity:.45; stroke-width:1.5; }
    .more { fill:none; stroke:var(--ink); stroke-opacity:.35; stroke-width:1.5; stroke-dasharray:5 4; }
    .acc-box { fill:var(--fill); stroke:var(--accent); stroke-width:2; }
    .t { font-size:16px; font-weight:600; }
    .c { font-size:14px; font-weight:600; }
    .s { font-size:13.5px; fill-opacity:.72; }
    .ln { fill:none; stroke:var(--ink); stroke-opacity:.55; stroke-width:1.5; marker-end:url(#ar); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="var(--ink)" fill-opacity=".55"/>
    </marker>
  </defs>

  <text class="t" x="30" y="32">Watched sources</text>

  <rect class="box" x="30" y="48" width="190" height="40" rx="8"/>
  <text class="c" x="125" y="73" text-anchor="middle">Gmail</text>

  <rect class="box" x="30" y="96" width="190" height="40" rx="8"/>
  <text class="c" x="125" y="121" text-anchor="middle">Slack</text>

  <rect class="box" x="30" y="144" width="190" height="40" rx="8"/>
  <text class="c" x="125" y="169" text-anchor="middle">Google Calendar</text>

  <rect class="box" x="30" y="192" width="190" height="40" rx="8"/>
  <text class="c" x="125" y="217" text-anchor="middle">Google Drive</text>

  <rect class="box" x="30" y="240" width="190" height="40" rx="8"/>
  <text class="c" x="125" y="265" text-anchor="middle">Notion</text>

  <rect class="more" x="30" y="288" width="190" height="40" rx="8"/>
  <text class="s" x="125" y="313" text-anchor="middle">any other app you connect</text>

  <text class="s" x="30" y="350">only the ones you switch on</text>

  <path class="ln" d="M224 68 C 272 68 276 140 316 140"/>
  <path class="ln" d="M224 116 C 272 116 276 155 316 155"/>
  <path class="ln" d="M224 164 C 272 164 276 170 316 170"/>
  <path class="ln" d="M224 212 C 272 212 276 185 316 185"/>
  <path class="ln" d="M224 260 C 272 260 276 200 316 200"/>
  <path class="ln" d="M224 308 C 272 308 276 212 316 212"/>

  <rect class="acc-box" x="320" y="108" width="200" height="124" rx="10"/>
  <text class="t" x="420" y="152" text-anchor="middle">Chief of Stuff</text>
  <text class="s" x="420" y="176" text-anchor="middle">checks, then does</text>
  <text class="s" x="420" y="196" text-anchor="middle">the work itself</text>

  <path class="ln" d="M524 170 H592"/>

  <text class="t" x="600" y="44">Ready</text>

  <text class="s" x="600" y="78">Before your next meeting</text>
  <rect class="box" x="600" y="90" width="250" height="62" rx="10"/>
  <text class="c" x="618" y="127">Meeting brief, written</text>

  <text class="s" x="600" y="190">Ready for you</text>
  <rect class="box" x="600" y="202" width="250" height="62" rx="10"/>
  <text class="c" x="618" y="239">Draft reply, ready to send</text>

  <text class="s" x="600" y="296">Send, open, or dismiss.</text>
  <text class="s" x="600" y="316">Nothing goes out until you click.</text>
</svg>
